name: daily-sleeves

on:
  schedule:
    - cron: "17 0 * * *"         # 00:17 UTC
  workflow_dispatch:
    inputs:
      countries:
        description: "Apple chart country codes"
        default: "us,gb,jp,br,in,de,fr,mx,kr,au,ca,es"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg gifsicle
      - run: pip install pillow numpy
      - name: Fetch covers
        run: python fetch.py --countries "${{ inputs.countries || 'us,gb,jp,br,in,de,fr,mx,kr,au,ca,es' }}"
      - name: Render
        run: python render.py
      - name: Assemble site
        run: |
          cp -R site/. dist/
          cp covers.json dist/covers.json
          ls -lh dist
      - uses: actions/upload-pages-artifact@v5
        with: { path: dist }

  keepalive:
    needs: build
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Keep Alive
        run: |
          if [ "$(date -u +%d)" = "01" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keep schedule alive"
            git push
          fi

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5